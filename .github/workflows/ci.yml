# Host tests and screenshots on every push and pull request; the firmware
# images too. On a v* tag, the images are attached to the GitHub release of
# that tag (a draft is created if there isn't one yet; write the notes there).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: test/run.sh
      - name: Screenshots
        run: test/screens.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: build/screens/*.png

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe: the build ID shown on the radio
      - name: Firmware images (full and receive-only)
        run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Attach to the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "K5-APRS ${TAG#v}"
          fi
